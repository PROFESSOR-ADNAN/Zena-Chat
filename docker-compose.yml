services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      PROCESS_ROLE: all
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_32_characters_minimum
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
      - redis

volumes:
  mongo-data:
  redis-data:
