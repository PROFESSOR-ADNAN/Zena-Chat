global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "zena-gateways"
    static_configs:
      - targets:
          - "gateway-1:5000"
          - "gateway-2:5000"
          - "gateway-3:5000"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
