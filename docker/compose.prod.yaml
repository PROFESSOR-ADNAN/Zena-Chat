services:
  mongo:
    image: mongo:7
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-prod-data:/data/db
    networks:
      - internal-net

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis-prod-data:/data
    networks:
      - internal-net

  gateway-1:
    image: ghcr.io/professor-adnan/zena-server:latest
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      PROCESS_ROLE: gateway
      GATEWAY_ID: prod-gw-1
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    networks:
      - internal-net

  gateway-2:
    image: ghcr.io/professor-adnan/zena-server:latest
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      PROCESS_ROLE: gateway
      GATEWAY_ID: prod-gw-2
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    networks:
      - internal-net

  gateway-3:
    image: ghcr.io/professor-adnan/zena-server:latest
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      PROCESS_ROLE: gateway
      GATEWAY_ID: prod-gw-3
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    networks:
      - internal-net

  worker:
    image: ghcr.io/professor-adnan/zena-worker:latest
    restart: always
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    networks:
      - internal-net

  nginx:
    image: nginx:1.26-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  mongo-prod-data:
  redis-prod-data:
