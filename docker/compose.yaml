services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Gateway Replica 1
  gateway-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      PORT: 5000
      NODE_ENV: development
      PROCESS_ROLE: all
      GATEWAY_ID: gw-1
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_32_characters_minimum
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Gateway Replica 2
  gateway-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      PORT: 5000
      NODE_ENV: development
      PROCESS_ROLE: all
      GATEWAY_ID: gw-2
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_32_characters_minimum
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Gateway Replica 3
  gateway-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      PORT: 5000
      NODE_ENV: development
      PROCESS_ROLE: all
      GATEWAY_ID: gw-3
      MONGO_URI: mongodb://mongo:27017/chat?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_32_characters_minimum
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local Nginx Load Balancer across the 3 gateway replicas
  nginx:
    image: nginx:1.26-alpine
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

volumes:
  mongo-data:
  redis-data:
